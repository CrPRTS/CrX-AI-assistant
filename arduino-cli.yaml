# arduino-cli 配置 —— 纯 VS Code 离线编译方案
# 用法: e:\ExtraAppsHDD\arduino-cli.exe --config-file arduino-cli.yaml compile -b esp32:esp32:esp32s3 AI_KEY_v3

board_manager:
  additional_urls: []

directories:
  # 离线平台与工具链（esp32 3.3.11 + esp-x32/esp-rv32 + esp32s3-libs + esptool）
  data: F:\Git\Arduino15
  downloads: F:\Git\Arduino15\staging
  # sketchbook：仓库内 libraries/ 子目录（git 子模块 PN532 + NDEF）
  user: F:\Git\CrX-AI-assistant

library:
  enable_unsafe_install: true

logging:
  level: info

metrics:
  enabled: false

output:
  no_color: true