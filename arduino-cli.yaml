# arduino-cli 配置 —— 纯 VS Code 离线编译方案
# 用法: F:\Git\arduino-cli\arduino-cli.exe --config-file arduino-cli.yaml compile -b esp32:esp32:esp32s3 AI_KEY_v3

board_manager:
  additional_urls: []

directories:
  # 离线平台与工具链（esp32 3.3.11 + esp-x32/esp-rv32 + esp32s3-libs + esptool）
  # 必须放在 Downloads 之外：PyInstaller 打包的 gen_esp32part.exe 等在 Downloads 下无法解压临时文件
  data: F:\Git\Arduino15
  downloads: F:\Git\Arduino15\staging
  # sketchbook：libraries/ 下是 PN532-arduino 与 NDEF
  user: F:\Git\arduino-sketchbook

library:
  enable_unsafe_install: true

logging:
  level: info

metrics:
  enabled: false

output:
  no_color: true